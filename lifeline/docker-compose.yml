services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - lifeline_mongo:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: lifeline
      JAC_ROOT: /app/jac
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - ./jac:/app/jac
      - ./backend:/app/backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  lifeline_mongo:
