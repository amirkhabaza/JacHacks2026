services:
  mongodb:
    image: mongo:7
    container_name: lifeline-mongodb
    ports:
      - "27017:27017"
    volumes:
      - lifeline_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  lifeline_mongodb_data:
