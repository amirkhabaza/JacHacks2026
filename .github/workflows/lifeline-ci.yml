name: lifeline-ci

on:
  push:
    paths:
      - "lifeline/**"
  pull_request:
    paths:
      - "lifeline/**"

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifeline/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest httpx
      - name: Compile
        run: python -m compileall app
      - name: Test
        run: pytest -q

  # TODO: frontend and Jac jobs in later checkpoints
