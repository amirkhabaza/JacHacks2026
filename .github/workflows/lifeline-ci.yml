name: lifeline-ci

on:
  push:
    paths:
      - "lifeline/**"
  pull_request:
    paths:
      - "lifeline/**"

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifeline/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest httpx
      - name: Test
        run: pytest -q

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifeline/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Lint / typecheck placeholder
        run: npx tsc --noEmit || true
        # TODO: fail CI once scaffold deps settle

